apiVersion: v1
kind: ConfigMap
metadata:
  name: apache-config
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
        <title>Apache Server on Kubernetes</title>
    </head>
    <body>
        <h1>Hello from Apache Server!</h1>
        <p>This is a simple Apache2 server running in a Kubernetes deployment.</p>
        <p>Accessed from host machine using NodePort service.</p>
    </body>
    </html>
