apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ecommerce
  labels:
    app: frontend
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        tier: frontend
    spec:
      containers:
      - name: frontend
        image: nginx:alpine
        ports:
        - containerPort: 80
          name: http
        command: ["sh", "-c"]
        args:
          - |
            cat > /usr/share/nginx/html/index.html <<'EOF'
            <!DOCTYPE html>
            <html lang="en">
            <head>
                <meta charset="UTF-8">
                <meta name="viewport" content="width=device-width, initial-scale=1.0">
                <title>E-Commerce Microservices</title>
                <style>
                    * { margin: 0; padding: 0; box-sizing: border-box; }
                    body {
                        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                        min-height: 100vh;
                        padding: 20px;
                    }
                    .container {
                        max-width: 1200px;
                        margin: 0 auto;
                        background: white;
                        border-radius: 20px;
                        padding: 40px;
                        box-shadow: 0 20px 60px rgba(0,0,0,0.3);
                    }
                    h1 {
                        color: #667eea;
                        text-align: center;
                        margin-bottom: 10px;
                        font-size: 2.5em;
                    }
                    .subtitle {
                        text-align: center;
                        color: #666;
                        margin-bottom: 40px;
                        font-size: 1.2em;
                    }
                    .services {
                        display: grid;
                        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
                        gap: 20px;
                        margin-bottom: 40px;
                    }
                    .service-card {
                        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                        padding: 30px;
                        border-radius: 15px;
                        color: white;
                        text-align: center;
                        transition: transform 0.3s;
                        cursor: pointer;
                    }
                    .service-card:hover {
                        transform: translateY(-5px);
                        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
                    }
                    .service-card h2 {
                        margin-bottom: 10px;
                        font-size: 1.5em;
                    }
                    .service-card p {
                        opacity: 0.9;
                    }
                    .api-section {
                        background: #f5f5f5;
                        padding: 30px;
                        border-radius: 15px;
                        margin-bottom: 30px;
                    }
                    .api-section h2 {
                        color: #667eea;
                        margin-bottom: 20px;
                    }
                    .endpoint {
                        background: white;
                        padding: 15px;
                        margin: 10px 0;
                        border-radius: 8px;
                        border-left: 4px solid #667eea;
                        font-family: 'Courier New', monospace;
                    }
                    .method {
                        display: inline-block;
                        padding: 5px 10px;
                        border-radius: 5px;
                        font-weight: bold;
                        margin-right: 10px;
                    }
                    .get { background: #4caf50; color: white; }
                    .post { background: #2196F3; color: white; }
                    .patch { background: #ff9800; color: white; }
                    button {
                        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                        color: white;
                        border: none;
                        padding: 12px 30px;
                        border-radius: 25px;
                        font-size: 16px;
                        cursor: pointer;
                        margin: 5px;
                        transition: transform 0.2s;
                    }
                    button:hover {
                        transform: scale(1.05);
                    }
                    #response {
                        background: #2c3e50;
                        color: #2ecc71;
                        padding: 20px;
                        border-radius: 10px;
                        font-family: 'Courier New', monospace;
                        margin-top: 20px;
                        min-height: 100px;
                        white-space: pre-wrap;
                        word-wrap: break-word;
                    }
                    .status {
                        display: inline-block;
                        padding: 5px 15px;
                        border-radius: 20px;
                        font-size: 0.9em;
                        margin: 10px 5px;
                    }
                    .status.healthy { background: #4caf50; color: white; }
                    .footer {
                        text-align: center;
                        color: #666;
                        margin-top: 40px;
                        padding-top: 20px;
                        border-top: 2px solid #eee;
                    }
                </style>
            </head>
            <body>
                <div class="container">
                    <h1>🛒 E-Commerce Microservices</h1>
                    <p class="subtitle">Kubernetes Multi-Service Application</p>
                    
                    <div class="services">
                        <div class="service-card">
                            <h2>🗄️ Database</h2>
                            <p>MongoDB 5.0</p>
                            <p>Persistent Storage: 2Gi</p>
                        </div>
                        <div class="service-card">
                            <h2>📦 Product Service</h2>
                            <p>Port: 3001</p>
                            <p>Replicas: 2</p>
                        </div>
                        <div class="service-card">
                            <h2>🛍️ Order Service</h2>
                            <p>Port: 3002</p>
                            <p>Replicas: 2</p>
                        </div>
                        <div class="service-card">
                            <h2>💻 Frontend</h2>
                            <p>Nginx</p>
                            <p>Replicas: 2</p>
                        </div>
                    </div>

                    <div class="api-section">
                        <h2>🔗 API Endpoints</h2>
                        
                        <h3 style="margin: 20px 0 10px 0; color: #764ba2;">Product Service</h3>
                        <div class="endpoint">
                            <span class="method get">GET</span>
                            <span>/api/products</span>
                            <button onclick="testAPI('/api/products', 'GET')">Test</button>
                        </div>
                        <div class="endpoint">
                            <span class="method get">GET</span>
                            <span>/api/products/:id</span>
                            <button onclick="testAPI('/api/products/1', 'GET')">Test</button>
                        </div>
                        
                        <h3 style="margin: 20px 0 10px 0; color: #764ba2;">Order Service</h3>
                        <div class="endpoint">
                            <span class="method get">GET</span>
                            <span>/api/orders</span>
                            <button onclick="testAPI('/api/orders', 'GET')">Test</button>
                        </div>
                        <div class="endpoint">
                            <span class="method get">GET</span>
                            <span>/api/orders/:id</span>
                            <button onclick="testAPI('/api/orders/1', 'GET')">Test</button>
                        </div>
                        
                        <h3 style="margin: 20px 0 10px 0; color: #764ba2;">Health Checks</h3>
                        <div style="margin-top: 15px;">
                            <button onclick="testAPI('/health', 'GET', 'product-service:3001')">Product Health</button>
                            <button onclick="testAPI('/health', 'GET', 'order-service:3002')">Order Health</button>
                        </div>
                    </div>

                    <div class="api-section">
                        <h2>📊 Response</h2>
                        <div id="response">Click a Test button to see API response...</div>
                    </div>

                    <div class="footer">
                        <p><strong>DevOps Lab Project 8</strong></p>
                        <p>Kubernetes Microservices Architecture</p>
                        <p style="margin-top: 10px;">
                            <span class="status healthy">4 Services Running</span>
                        </p>
                    </div>
                </div>

                <script>
                    async function testAPI(endpoint, method, customUrl) {
                        const responseDiv = document.getElementById('response');
                        responseDiv.textContent = 'Loading...';
                        
                        try {
                            // Use the custom URL if provided, otherwise use the endpoint
                            const url = customUrl ? \`http://\${customUrl}\${endpoint}\` : endpoint;
                            
                            const response = await fetch(url, {
                                method: method,
                                headers: {
                                    'Content-Type': 'application/json',
                                }
                            });
                            
                            const data = await response.json();
                            responseDiv.textContent = JSON.stringify(data, null, 2);
                        } catch (error) {
                            responseDiv.textContent = \`Error: \${error.message}\n\nNote: Direct service calls may not work from browser.\nTry using kubectl port-forward or check service endpoints.\`;
                        }
                    }
                    
                    // Display welcome message on load
                    window.onload = function() {
                        document.getElementById('response').textContent = 
                            'Welcome to E-Commerce Microservices!\n\n' +
                            'Architecture Overview:\n' +
                            '- Frontend: Nginx serving static content\n' +
                            '- Product Service: Node.js API on port 3001\n' +
                            '- Order Service: Node.js API on port 3002\n' +
                            '- Database: MongoDB with persistent storage\n\n' +
                            'All services are configured with:\n' +
                            '✓ ConfigMaps for configuration\n' +
                            '✓ Secrets for sensitive data\n' +
                            '✓ Health checks (liveness/readiness probes)\n' +
                            '✓ Resource limits\n' +
                            '✓ Multiple replicas for high availability';
                    };
                </script>
            </body>
            </html>
            EOF
            
            # Create nginx config
            cat > /etc/nginx/conf.d/default.conf <<'EOF'
            server {
                listen 80;
                server_name localhost;
                
                root /usr/share/nginx/html;
                index index.html;
                
                location / {
                    try_files $uri $uri/ /index.html;
                }
                
                location /api/products {
                    proxy_pass http://product-service:3001/products;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                }
                
                location /api/orders {
                    proxy_pass http://order-service:3002/orders;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                }
            }
            EOF
            
            nginx -g 'daemon off;'
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
