apiVersion: apps/v1
kind: Deployment
metadata:
  name: socialmedia-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: socialmedia
  template:
    metadata:
      labels:
        app: socialmedia
    spec:
      containers:
        - name: socialmedia
          image: mak2580/socialmedia-app:1.0
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: "100m"
            limits:
              cpu: "200m"
