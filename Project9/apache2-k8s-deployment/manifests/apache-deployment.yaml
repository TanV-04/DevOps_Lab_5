apiVersion: apps/v1
kind: Deployment
metadata:
  name: apache-deploy
  labels:
    app: apache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apache
  template:
    metadata:
      labels:
        app: apache
    spec:
      containers:
        - name: apache-container
          image: httpd:2.4
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html-content
              mountPath: /usr/local/apache2/htdocs/
      volumes:
        - name: html-content
          configMap:
            name: apache-configmap
