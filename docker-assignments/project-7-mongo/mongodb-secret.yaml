apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secret
  namespace: mongodb-app
type: Opaque
data:
  # Base64 encoded values
  # To encode: echo -n 'your-value' | base64
  # username: admin (YWRtaW4=)
  # password: password123 (cGFzc3dvcmQxMjM=)
  username: YWRtaW4=
  password: cGFzc3dvcmQxMjM=