apiVersion: v1
kind: ConfigMap
metadata:
  name: apache-config
  namespace: apache-server
data:
  # Apache configuration
  apache2.conf: |
    ServerRoot "/usr/local/apache2"
    Listen 80
    
    LoadModule mpm_event_module modules/mod_mpm_event.so
    LoadModule authn_core_module modules/mod_authn_core.so
    LoadModule authz_core_module modules/mod_authz_core.so
    LoadModule dir_module modules/mod_dir.so
    LoadModule mime_module modules/mod_mime.so
    LoadModule log_config_module modules/mod_log_config.so
    LoadModule unixd_module modules/mod_unixd.so
    
    <IfModule unixd_module>
      User daemon
      Group daemon
    </IfModule>
    
    ServerAdmin admin@example.com
    ServerName localhost
    
    <Directory />
        AllowOverride none
        Require all denied
    </Directory>
    
    DocumentRoot "/usr/local/apache2/htdocs"
    <Directory "/usr/local/apache2/htdocs">
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
    
    <IfModule dir_module>
        DirectoryIndex index.html
    </IfModule>
    
    <Files ".ht*">
        Require all denied
    </Files>
    
    ErrorLog /proc/self/fd/2
    LogLevel warn
    
    <IfModule log_config_module>
        LogFormat "%h %l %u %t \"%r\" %>s %b" common
        CustomLog /proc/self/fd/1 common
    </IfModule>
    
    <IfModule mime_module>
        TypesConfig conf/mime.types
        AddType application/x-compress .Z
        AddType application/x-gzip .gz .tgz
    </IfModule>
  
  # Custom index.html
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Apache2 Server - Project 9</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            
            body {
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 20px;
            }
            
            .container {
                background: white;
                border-radius: 20px;
                padding: 50px;
                box-shadow: 0 20px 60px rgba(0,0,0,0.3);
                max-width: 800px;
                width: 100%;
                text-align: center;
            }
            
            .logo {
                font-size: 80px;
                margin-bottom: 20px;
            }
            
            h1 {
                color: #667eea;
                font-size: 2.5em;
                margin-bottom: 10px;
            }
            
            .subtitle {
                color: #666;
                font-size: 1.3em;
                margin-bottom: 30px;
            }
            
            .info-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                gap: 20px;
                margin: 40px 0;
            }
            
            .info-card {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                padding: 25px;
                border-radius: 15px;
                color: white;
            }
            
            .info-card h3 {
                font-size: 1.1em;
                margin-bottom: 10px;
                opacity: 0.9;
            }
            
            .info-card p {
                font-size: 1.5em;
                font-weight: bold;
            }
            
            .features {
                background: #f5f5f5;
                padding: 30px;
                border-radius: 15px;
                margin: 30px 0;
                text-align: left;
            }
            
            .features h2 {
                color: #667eea;
                margin-bottom: 20px;
                text-align: center;
            }
            
            .feature-list {
                list-style: none;
                padding: 0;
            }
            
            .feature-list li {
                padding: 10px;
                margin: 8px 0;
                background: white;
                border-radius: 8px;
                border-left: 4px solid #667eea;
            }
            
            .feature-list li::before {
                content: "✅ ";
                margin-right: 10px;
            }
            
            .status {
                display: inline-block;
                padding: 10px 30px;
                background: #4caf50;
                color: white;
                border-radius: 25px;
                font-weight: bold;
                font-size: 1.1em;
                margin: 20px 0;
                animation: pulse 2s infinite;
            }
            
            @keyframes pulse {
                0%, 100% { transform: scale(1); }
                50% { transform: scale(1.05); }
            }
            
            .footer {
                margin-top: 40px;
                padding-top: 20px;
                border-top: 2px solid #eee;
                color: #666;
            }
            
            .badge {
                display: inline-block;
                padding: 8px 20px;
                background: #667eea;
                color: white;
                border-radius: 20px;
                margin: 5px;
                font-size: 0.9em;
            }
            
            code {
                background: #2c3e50;
                color: #2ecc71;
                padding: 3px 8px;
                border-radius: 5px;
                font-family: 'Courier New', monospace;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="logo">🚀</div>
            <h1>Apache2 Server</h1>
            <p class="subtitle">Running on Kubernetes</p>
            
            <div class="status">● Server Running</div>
            
            <div class="info-grid">
                <div class="info-card">
                    <h3>Server</h3>
                    <p>Apache 2.4</p>
                </div>
                <div class="info-card">
                    <h3>Port</h3>
                    <p>80</p>
                </div>
                <div class="info-card">
                    <h3>Platform</h3>
                    <p>Kubernetes</p>
                </div>
                <div class="info-card">
                    <h3>Project</h3>
                    <p>#9</p>
                </div>
            </div>
            
            <div class="features">
                <h2>🎯 Deployment Features</h2>
                <ul class="feature-list">
                    <li>Deployed using Kubernetes Deployment</li>
                    <li>Multiple replicas for high availability</li>
                    <li>ConfigMap for custom configuration</li>
                    <li>NodePort service for external access</li>
                    <li>Custom HTML content</li>
                    <li>Health checks configured</li>
                    <li>Resource limits applied</li>
                </ul>
            </div>
            
            <div style="margin: 30px 0;">
                <span class="badge">Kubernetes</span>
                <span class="badge">Apache2</span>
                <span class="badge">ConfigMap</span>
                <span class="badge">NodePort</span>
                <span class="badge">DevOps</span>
            </div>
            
            <div class="footer">
                <p><strong>DevOps Lab - Project 9</strong></p>
                <p style="margin-top: 10px;">Apache2 Server Deployment on Kubernetes</p>
                <p style="margin-top: 10px; font-size: 0.9em;">
                    Access via: <code>http://localhost:30090</code>
                </p>
                <p style="margin-top: 10px; font-size: 0.9em;">
                    Namespace: <code>apache-server</code>
                </p>
            </div>
        </div>
        
        <script>
            // Display server information
            console.log('Apache2 Server - Project 9');
            console.log('Running on Kubernetes');
            console.log('Namespace: apache-server');
            console.log('Port: 80 → NodePort 30090');
        </script>
    </body>
    </html>
